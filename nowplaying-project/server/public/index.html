<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e14;
    --surface: #12161f;
    --surface-edge: #1d2330;
    --amber: #ffb454;
    --teal: #4fd1c5;
    --paper: #f5f1e8;
    --muted: #8891a3;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Sora', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* ページの背景にうっすら滲む光 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(600px 400px at 20% 30%, rgba(255,180,84,0.06), transparent 60%),
      radial-gradient(500px 350px at 80% 75%, rgba(79,209,197,0.05), transparent 60%);
    pointer-events: none;
  }

  .card {
    position: relative;
    display: flex;
    align-items: center;
    gap: 32px;
    background: var(--surface);
    border: 1px solid var(--surface-edge);
    border-radius: 18px;
    padding: 28px 40px 28px 28px;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6);
    min-width: 480px;
    max-width: 640px;
  }

  .eyebrow {
    position: absolute;
    top: -13px;
    left: 28px;
    background: var(--bg);
    padding: 0 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .eyebrow .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }
  .eyebrow.playing .dot {
    background: var(--amber);
    box-shadow: 0 0 8px var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* --- レコードプレイヤー(サイン要素) --- */
  .turntable {
    position: relative;
    width: 132px;
    height: 132px;
    flex: none;
  }

  .disc {
    width: 132px;
    height: 132px;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center, #1a1f2b 0px, #1a1f2b 2px, #232a3a 3px, #232a3a 4px);
    border: 2px solid #2a3142;
    position: relative;
    animation: spin 6s linear infinite;
    animation-play-state: paused;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
  }

  .disc.spinning { animation-play-state: running; }

  .disc .label {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--amber), #d98a3d);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .disc .label::after {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--bg);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* トーンアーム: 再生中は盤に乗る、止まると持ち上がる */
  .tonearm {
    position: absolute;
    top: -6px;
    right: -14px;
    width: 74px;
    height: 74px;
    transform-origin: 90% 10%;
    transform: rotate(-32deg);
    transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .tonearm.down {
    transform: rotate(-6deg);
  }
  .tonearm svg { width: 100%; height: 100%; display: block; }

  /* --- 曲情報 --- */
  .info {
    min-width: 0;
    flex: 1;
  }

  .title {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .artist {
    margin-top: 4px;
    font-size: 15px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .meta-row {
    margin-top: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .eq {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 16px;
  }
  .eq span {
    width: 3px;
    background: var(--amber);
    border-radius: 2px;
    animation: bounce 0.9s ease-in-out infinite;
    opacity: 0.5;
  }
  .eq.active span { opacity: 1; }
  .eq span:nth-child(1){ height: 40%; animation-delay: 0s; }
  .eq span:nth-child(2){ height: 100%; animation-delay: 0.15s; }
  .eq span:nth-child(3){ height: 60%; animation-delay: 0.3s; }
  .eq span:nth-child(4){ height: 80%; animation-delay: 0.45s; }

  .eq.active span { animation-play-state: running; }
  .eq:not(.active) span { animation-play-state: paused; height: 20% !important; }

  @keyframes bounce {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }

  .status-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .disc, .eq span, .eyebrow .dot { animation: none !important; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="eyebrow" id="eyebrow"><span class="dot"></span><span id="eyebrow-text">OFFLINE</span></div>

    <div class="turntable">
      <div class="disc" id="disc"><div class="label"></div></div>
      <div class="tonearm" id="tonearm">
        <svg viewBox="0 0 74 74" fill="none">
          <circle cx="64" cy="10" r="7" fill="#2a3142" stroke="#4a5468" stroke-width="1.5"/>
          <rect x="16" y="8" width="50" height="4" rx="2" fill="#3a4256" transform="rotate(38 64 10)"/>
          <circle cx="14" cy="52" r="4" fill="#ffb454"/>
        </svg>
      </div>
    </div>

    <div class="info">
      <div class="title" id="title">曲情報を待っています…</div>
      <div class="artist" id="artist">配信のプレイヤーが再生を始めるとここに表示されます</div>
      <div class="meta-row">
        <div class="eq" id="eq"><span></span><span></span><span></span><span></span></div>
        <div class="status-text" id="status-text">CONNECTING…</div>
      </div>
    </div>
  </div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
  const socket = io();

  const eyebrow = document.getElementById('eyebrow');
  const eyebrowText = document.getElementById('eyebrow-text');
  const disc = document.getElementById('disc');
  const tonearm = document.getElementById('tonearm');
  const titleEl = document.getElementById('title');
  const artistEl = document.getElementById('artist');
  const eq = document.getElementById('eq');
  const statusText = document.getElementById('status-text');

  function render(track) {
    const state = track.state || 'offline';

    if (state === 'playing') {
      eyebrow.classList.add('playing');
      eyebrowText.textContent = 'ON AIR';
      disc.classList.add('spinning');
      tonearm.classList.add('down');
      eq.classList.add('active');
      statusText.textContent = 'NOW PLAYING';
    } else if (state === 'paused') {
      eyebrow.classList.remove('playing');
      eyebrowText.textContent = 'PAUSED';
      disc.classList.remove('spinning');
      tonearm.classList.remove('down');
      eq.classList.remove('active');
      statusText.textContent = 'PAUSED';
    } else {
      eyebrow.classList.remove('playing');
      eyebrowText.textContent = 'OFFLINE';
      disc.classList.remove('spinning');
      tonearm.classList.remove('down');
      eq.classList.remove('active');
      statusText.textContent = 'WAITING FOR STREAM…';
    }

    if (track.title) {
      titleEl.textContent = track.title;
      artistEl.textContent = track.artist || '不明なアーティスト';
    } else if (state !== 'offline') {
      titleEl.textContent = '曲情報を取得中…';
      artistEl.textContent = '';
    } else {
      titleEl.textContent = '曲情報を待っています…';
      artistEl.textContent = '配信のプレイヤーが再生を始めるとここに表示されます';
    }
  }

  socket.on('nowPlaying', render);

  // 初期表示(ソケット接続が確立する前に一度APIから取得しておく)
  fetch('/api/now').then(r => r.json()).then(render).catch(() => {});
</script>
</body>
</html>
